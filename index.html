<script>

/* ========================================= */
/* GOOGLE SHEETS API                         */
/* ========================================= */

const SHEET_API =
"https://script.google.com/macros/s/AKfycbzFfVZpPKDJsYYesVr0pQ-b_dAZpvGBeRaSZse1XvPe2mCRF3ZRnNdeDm6n-YyBlKNR/exec";


/* ========================================= */
/* VARIABLES                                 */
/* ========================================= */

let allNews = [];

let currentIndex = 0;

let headlineTimer;


/* ========================================= */
/* LOAD ALL HEADLINES                        */
/* ========================================= */

async function loadNews() {

  try {

    const response = await fetch(
      SHEET_API
    );


    const data =
      await response.json();


    console.log(
      "Mugango News:",
      data
    );


    if (
      !data.success ||
      !Array.isArray(data.news) ||
      data.news.length === 0
    ) {

      document.getElementById(
        "headline"
      ).textContent =
        "No headlines available";

      return;

    }


    /* SAVE ALL HEADLINES */

    allNews =
      data.news;


    /* START */

    currentIndex = 0;

    showHeadline();


    /* CHANGE EVERY 15 SECONDS */

    clearInterval(
      headlineTimer
    );


    headlineTimer =
      setInterval(
        nextHeadline,
        15000
      );


  }

  catch(error) {

    console.error(
      "News error:",
      error
    );


    document.getElementById(
      "headline"
    ).textContent =
      "Unable to load latest news";

  }

}


/* ========================================= */
/* SHOW HEADLINE                             */
/* ========================================= */

function showHeadline() {

  if (
    allNews.length === 0
  ) {

    return;

  }


  const story =
    allNews[currentIndex];


  const headline =
    document.getElementById(
      "headline"
    );


  const time =
    document.getElementById(
      "time"
    );


  const counter =
    document.getElementById(
      "counter"
    );


  const progress =
    document.getElementById(
      "progress-bar"
    );


  /* FADE OUT */

  headline.style.opacity = "0";


  setTimeout(function() {


    /* HEADLINE */

    headline.textContent =

      story.headline ||
      story.Headline ||
      "Latest Mugango News";


    /* LINK */

    headline.href =
      story.link || "#";


    /* DATE */

    if (story.date) {

      const date =
        new Date(
          story.date
        );


      time.textContent =
        "Updated • " +
        (
          isNaN(date)
          ? story.date
          : date.toLocaleString()
        );

    }

    else {

      time.textContent =
        "Latest update";

    }


    /* COUNTER */

    counter.textContent =

      (currentIndex + 1) +
      " / " +
      allNews.length;


    /* RESET PROGRESS */

    progress.style.transition =
      "none";

    progress.style.width =
      "0%";


    setTimeout(function() {

      progress.style.transition =
        "width 15s linear";

      progress.style.width =
        "100%";

    }, 50);


    /* FADE IN */

    headline.style.opacity =
      "1";


  }, 500);

}


/* ========================================= */
/* NEXT HEADLINE                             */
/* ========================================= */

function nextHeadline() {

  currentIndex++;


  if (
    currentIndex >=
    allNews.length
  ) {

    currentIndex = 0;

  }


  showHeadline();

}


/* ========================================= */
/* START                                     */
/* ========================================= */

loadNews();

</script>

// Automatic Date & Time
function updateDateTime(){
    const now = new Date();

    const options = {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit"
    };

    document.getElementById("datetime").innerHTML =
        now.toLocaleString("en-KE", options);

    document.getElementById("year").innerHTML =
        now.getFullYear();
}

setInterval(updateDateTime,1000);
updateDateTime();
