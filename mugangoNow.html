    <span class="gold-line"></span>
    <div>
      <span class="section-label">MUGANGO NEWS</span>
      <h2>Latest Stories</h2>

<style>

.news-section {
  width: 100%;
  max-width: 1100px;
  margin: 50px auto;
  padding: 0 18px;
}

/* SECTION HEADING */

.section-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 28px;
}

.section-heading .gold-line {
  height: 1px;
  flex: 1;
  max-width: 130px;
  background: linear-gradient(
    to right,
    transparent,
    #d4af37,
    transparent
  );
}

.section-label {
  display: block;
  text-align: center;
  color: #d4af37;
  font-size: 11px;
  letter-spacing: 4px;
  font-weight: bold;
}

.section-heading h2 {
  margin-top: 5px;
  text-align: center;
  color: #fff;
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
}

/* NEWS CONTAINER */

#news-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 22px;
}

/* LOADING CARD */

.loading-card {
  grid-column: 1 / -1;
  min-height: 220px;
  padding: 45px 20px;
  text-align: center;

  background:
    linear-gradient(
      145deg,
      rgba(212, 175, 55, 0.08),
      rgba(0, 0, 0, 0.95)
    );

  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 14px;

  box-shadow:
    0 15px 40px rgba(0, 0, 0, 0.6),
    inset 0 0 30px rgba(212, 175, 55, 0.03);
}

/* LOADER */

.loader {
  width: 42px;
  height: 42px;
  margin: 0 auto 18px;

  border: 3px solid #292929;
  border-top: 3px solid #d4af37;
  border-right: 3px solid #d4af37;

  border-radius: 50%;

  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text span {
  color: #d4af37;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
}

.loading-text p {
  margin-top: 8px;
  color: #aaa;
  font-size: 14px;
}

/* NEWS CARD */

.news-card {
  position: relative;
  padding: 26px;

  background:
    linear-gradient(
      145deg,
      #151515,
      #090909
    );

  border: 1px solid rgba(212, 175, 55, 0.28);
  border-radius: 14px;

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.55);

  transition:
    transform 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}

.news-card:hover {
  transform: translateY(-5px);

  border-color: rgba(212, 175, 55, 0.8);

  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.7),
    0 0 20px rgba(212, 175, 55, 0.08);
}

/* GOLD CATEGORY */

.news-category {
  display: inline-block;

  margin-bottom: 14px;
  padding: 6px 12px;

  color: #d4af37;

  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 20px;

  font-size: 10px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* HEADLINE */

.news-card h2 {
  margin-bottom: 13px;

  color: #fff;

  font-family: Georgia, serif;
  font-size: 22px;
  line-height: 1.35;
}

/* STORY */

.news-card p {
  color: #c4c4c4;
  font-size: 15px;
  line-height: 1.75;
}

/* META */

.news-meta {
  margin-top: 20px;
  padding-top: 14px;

  border-top: 1px solid rgba(255, 255, 255, 0.08);

  color: #888;
  font-size: 12px;
}

    </style>
<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbzFfVZpPKDJsYYesVr0pQ-b_dAZpvGBeRaSZse1XvPe2mCRF3ZRnNdeDm6n-YyBlKNR/exec";

async function loadNews() {
  const container = document.getElementById("news-container");

  try {
    const response = await fetch(SHEET_API);

    if (!response.ok) {
      throw new Error("Unable to connect to the news feed.");
    }

    const data = await response.json();

    if (!data.success || !Array.isArray(data.news) || data.news.length === 0) {
      container.innerHTML = `
        <div class="loading-card">
          <p>No stories available at the moment.</p>
        </div>
      `;
      return;
    }

    const news = data.news;

    container.innerHTML = news.map(item => `
      <article class="news-card">
        <div class="news-category">
          ${item.category || "News"}
        </div>

        <h2>
          ${item.headline || "Untitled Story"}
        </h2>

        <p>
          ${item.story || ""}
        </p>

        <div class="news-meta">
          ${item.author || "Mugango News"} •
          ${item.date ? new Date(item.date).toLocaleDateString() : ""}
        </div>
      </article>
    `).join("");

  } catch (error) {
    console.error("News loading error:", error);

    container.innerHTML = `
      <div class="loading-card">
        <p>Unable to load news at the moment.</p>
      </div>
    `;
  }
}

loadNews();

setInterval(loadNews, 5 * 60 * 1000);
</script>
